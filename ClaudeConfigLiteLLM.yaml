litellm_settings:
  drop_params: true

  ignore_unknown_params: true # <- Принудительно отсекать всё лишнее

  pessimistic_cooldown: false
  cooldown_time: 5
  # Было:
  # success_callbacks: ["anthropic_tpm_rpm_headers"]
  # failure_callbacks: ["anthropic_tpm_rpm_headers"]

  # Стало:
  success_callbacks: []
  failure_callbacks: []



general_settings:
  disable_ui: true

guardrails:
  - guardrail_name: headroom-compression
    litellm_params:
      guardrail: headroom
      mode: pre_call
      api_base: http://127.0.0.1:8787
      extra_body:
        verify: false           # <--- отключить SSL для localhost
